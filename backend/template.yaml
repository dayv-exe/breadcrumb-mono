AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SAM template for Breadcrumb

Globals:
  Function:
    Timeout: 10
    Runtime: provided.al2023
    MemorySize: 512
    Architectures: [arm64]
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        SEARCH_TABLE: !Ref SearchTable
        MEDIA_BUCKET: !Ref MediaBucket
        CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistribution
        CLOUDFRONT_DOMAIN: !GetAtt CloudFrontDistribution.DomainName
        QUEUE_URL: !GetAtt BreadQueue.QueueName

Parameters:
  EnvironmentName:
    Type: String
    Description: "Environment name either production or test"
    Default: "test"

Resources:
  # auth
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-${EnvironmentName}-UserPool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: nickname
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: birthdate
          AttributeDataType: String
          Required: false
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${AWS::StackName}-${EnvironmentName}-Client
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - USER_PASSWORD_AUTH

  CognitoCustomMessageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-${EnvironmentName}-CustomCognitoMessage
      MemorySize: 128
      CodeUri: bin/custom_email/custom_email.zip
      Handler: bootstrap
      Runtime: provided.al2023
      Description: Custom email logic for Cognito events
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: "*"
      Events:
        CognitoCustomMessageTrigger:
          Type: Cognito
          Properties:
            UserPool: !Ref CognitoUserPool
            Trigger: CustomMessage

  # api gateway
  BreadApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub ${AWS::StackName}-${EnvironmentName}-api
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - DELETE
          - PUT
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
      StageName: prod
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
              audience:
                - !Ref CognitoUserPoolClient
              claims:
                email_verified: "true"

  # bucket for media
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-${EnvironmentName}-media-bucket-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - PUT
              - POST
              - GET
              - HEAD

            AllowedOrigins:
              - "*"

            AllowedHeaders:
              - "*"
            MaxAge: 3000 # for browser cache
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultiPartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-${EnvironmentName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !GetAtt MediaBucket.RegionalDomainName
            Id: S3Origin
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref CloudFrontOriginAccessControl
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          TrustedKeyGroups:
            - !Ref CloudFrontKeyGroup
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  CloudFrontPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        Name: !Sub "${AWS::StackName}-${EnvironmentName}-cf-public-key"
        CallerReference: !Sub "${AWS::StackName}-${EnvironmentName}-${AWS::Region}"
        EncodedKey: "-----BEGIN PUBLIC KEY-----\\n-----END PUBLIC KEY-----"

  CloudFrontKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Name: !Sub "${AWS::StackName}-${EnvironmentName}-cf-key-group"
        Items:
          - !Ref CloudFrontPublicKey

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
  
  GeneratePresignedUrl:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-${EnvironmentName}-S3ActionFunction
      CodeUri: bin/generate_presigned_url/generate_presigned_url.zip
      Handler: bootstrap
      Description: to presign url for uploads
      Environment:
        Variables:
          MEDIA_BUCKET: !Ref MediaBucket
          SECRETS_MANAGER_ARN: !Ref CloudFrontKeysSecret
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistribution
          CLOUDFRONT_DOMAIN: !GetAtt CloudFrontDistribution.DomainName
      Events:
        ApiRequest:
          Type: HttpApi
          Properties:
            Path: /presigned_url
            Method: GET
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub "${MediaBucket.Arn}/uploads/*"

      # ill remove this later we dont need to use cloud front secrets
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref CloudFrontKeysSecret

  MediaAccess:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-${EnvironmentName}-MediaAccess
      CodeUri: bin/media_access/media_access.zip
      Handler: bootstrap
      Description: Returns CloudFront signed cookies/URL for authorized users
      Environment:
        Variables:
          CLOUDFRONT_DOMAIN: !GetAtt CloudFrontDistribution.DomainName
          CF_PRIVATE_KEY_SECRET_ARN: !Ref CloudFrontKeysSecret
          USERS_TABLE: !Ref UsersTable 
      Events:
        ApiRequest:
          Type: HttpApi
          Properties:
            Path: /media/access
            Method: POST
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref CloudFrontKeysSecret
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  CloudFrontKeysSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-${EnvironmentName}-cloudfront-keys"
      Description: "CloudFront private/public key pair for signed URLs"
      GenerateSecretString:
        SecretStringTemplate: '{"private_key":"","public_key":"","key_pair_id":""}'
        GenerateStringKey: "placeholder"

  PreSignUp:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-${EnvironmentName}-pre-signup-function"
      MemorySize: 128
      CodeUri: bin/signup_presignup/signup_presignup.zip
      Handler: bootstrap
      Description: Lambda function that runs before user signs up to validate user details
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        CognitoTrigger:
          Type: Cognito
          Properties:
            UserPool: !Ref CognitoUserPool
            Trigger: PreSignUp

  SignupUnfinishedRemover:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-${EnvironmentName}-remove-stale-accounts"
      MemorySize: 128
      CodeUri: bin/signup_unfinished_remover/signup_unfinished_remover.zip
      Handler: bootstrap
      Description: deletes unverified users from cognito when called
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
      Events:
        ScheduledRun:
          Type: Schedule
          Properties:
            Schedule: rate(12 hours)
            Name: DeleteUnconfirmedUsersSchedule
            Description: Runs every 12 hours, scans cognito users and deletes users with accounts older than 24 hours and are still unconfirmed
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - cognito-idp:ListUsers
              - cognito-idp:AdminDeleteUser
            Resource: "*"

  MainHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-${EnvironmentName}-main-handler"
      CodeUri: bin/main_handler/main_handler.zip
      Handler: bootstrap
      Description: handle everything
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
      Events:
        # for friends endpoints
        GetFriends:
          Type: HttpApi
          Properties:
            Path: /friends/{id}
            Method: GET
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
        AcceptFriendRequest:
          Type: HttpApi
          Properties:
            Path: /friends
            Method: POST
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
        RemoveFriend:
          Type: HttpApi
          Properties:
            Path: /friends/{id}
            Method: DELETE
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer

        #for friend requests
        GetFriendRequests:
          Type: HttpApi
          Properties:
            Path: /friend-requests
            Method: GET
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
        SendFriendRequests:
          Type: HttpApi
          Properties:
            Path: /friend-requests
            Method: POST
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
        RejectFriendRequests:
          Type: HttpApi
          Properties:
            Path: /friend-requests/{id}
            Method: DELETE
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
    
        # for user stuff
        GetUser:
          Type: HttpApi
          Properties:
            Path: /users/{id}
            Method: GET
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
        CreateUser:
          Type: HttpApi
          Properties:
            Path: /users
            Method: POST
            ApiId: !Ref BreadApi
        DeleteUser:
          Type: HttpApi
          Properties:
            Path: /users/{id}
            Method: DELETE
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
        EditUser:
          Type: HttpApi
          Properties:
            Path: /users/{id}
            Method: PUT
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
        AbortSignup:
          Type: HttpApi
          Properties:
            Path: /signup/{id}
            Method: DELETE
            ApiId: !Ref BreadApi
      
        # for search
        SearchUser:
          Type: HttpApi
          Properties:
            Path: /search/{str}
            Method: GET
            ApiId: !Ref BreadApi
            Auth:
              Authorizer: CognitoAuthorizer
        NicknameAvailable:
          Type: HttpApi
          Properties:
            Path: /search/{str}
            Method: POST
            ApiId: !Ref BreadApi

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SearchTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt BreadQueue.QueueName
        - Statement:
            Effect: Allow
            Action:
              - cognito-idp:AdminDeleteUser
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminUserGlobalSignOut
            Resource: "*"

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-${EnvironmentName}-Main"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi
          AttributeType: S
        - AttributeName: lsi
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      LocalSecondaryIndexes:
        - IndexName: LSIndex
          KeySchema:
            - AttributeName: pk
              KeyType: HASH
            - AttributeName: lsi
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
            
      GlobalSecondaryIndexes:
        - IndexName: GSIndex
          KeySchema:
            - AttributeName: gsi
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        
  SearchTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-${EnvironmentName}-search"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  QueueActions:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-bread-queue-actions-${EnvironmentName}
      CodeUri: bin/queue_actions/queue_actions.zip
      Handler: bootstrap
      Description: function to handle stuff in queue
      Policies: 
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - SQSPollerPolicy:
            QueueName: !GetAtt BreadQueue.QueueName
      Events:
        BreadQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt BreadQueue.Arn

  BreadQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-bread-queue-${EnvironmentName}
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BreadDeadLetterQueue.Arn
        maxReceiveCount: 3

  BreadDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-bread-dlq-${EnvironmentName}

Outputs:
  BreadApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${BreadApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  CognitoUserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref CognitoUserPool
  CognitoUserPoolClientId:
    Description: "Cognito App Client ID"
    Value: !Ref CognitoUserPoolClient

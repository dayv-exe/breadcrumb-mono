name: Build and deploy Breadcrumb backend in test environment

env:
  AWS_REGION: "eu-west-2"

on:
  push:
    branches-ignore:
      - main
      - beta

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Read build directories
        id: build-dirs
        run: |
          BUILD_DIRS=$(tr '\n' ',' < build_dirs.txt | sed 's/,$//')
          echo "dirs=$BUILD_DIRS" >> "$GITHUB_OUTPUT"
          echo "Build directories: $BUILD_DIRS"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: run utils unit tests
        working-directory: backend/utils
        run: go test -v ./...

      - name: run unit tests for models
        working-directory: backend/models
        run: go test -v ./...

      - name: configure aws creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TEST }}
          role-session-name: github-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: build go bins for lambda in container
        working-directory: .
        env:
          BUILD_DIRS: ${{ steps.build-dirs.outputs.dirs }}
        run: |
          set -euo pipefail
          rm -rf backend/bin
          mkdir -p backend/bin

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e BUILD_DIRS="$BUILD_DIRS" \
            -v "${{ github.workspace }}/backend:/app" \
            -w /app \
            golang:1.24-bookworm \
            sh -c '
              set -e
              apt-get update >/dev/null
              apt-get install -y --no-install-recommends zip >/dev/null

              export CGO_ENABLED=0
              export GOOS=linux
              export GOARCH=arm64

              mkdir -p bin

              echo "$BUILD_DIRS" | tr "," "\n" | xargs -r -P 4 -I {} sh -c "
                dir=\"\$1\"
                [ -n \"\$dir\" ] || exit 0
                echo \"==> Building \$dir\"
                mkdir -p \"bin/\$dir\"
                go build -trimpath -ldflags=\"-s -w\" \
                  -o \"bin/\$dir/bootstrap\" \"./cmd/\$dir/main.go\"

                (
                  cd \"bin/\$dir\"
                  zip -q \"\${dir}.zip\" bootstrap
                )
              " _ {}
            '

      - name: verify built artifacts
        run: |
          set -euo pipefail
          echo "${{ steps.build-dirs.outputs.dirs }}" | tr ',' '\n' | while read -r dir; do
            [ -n "$dir" ] || continue
            test -f "bin/$dir/${dir}.zip"
            echo "Found bin/$dir/${dir}.zip"
          done

      - name: deploy sam
        run: |
          sam deploy \
            --template-file template.yaml \
            --s3-bucket breadcrumb-stack-${{ env.AWS_REGION }}-test \
            --stack-name breadcrumb-stack-test \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides EnvironmentName=test \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Get CloudFront PublicKey ID and Secret ID
        id: cf-ids
        run: |
          CF_PUBLIC_KEY_ID=$(aws cloudformation describe-stack-resource \
            --stack-name breadcrumb-stack-test \
            --logical-resource-id CloudFrontPublicKey \
            --region ${{ env.AWS_REGION }} \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          SECRET_ID=$(aws cloudformation describe-stack-resource \
            --stack-name breadcrumb-stack-test \
            --logical-resource-id CloudFrontKeysSecret \
            --region ${{ env.AWS_REGION }} \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          echo "CloudFront PublicKey ID (key_pair_id): $CF_PUBLIC_KEY_ID"
          echo "Secrets Manager Secret ID: $SECRET_ID"
          echo "key_pair_id=$CF_PUBLIC_KEY_ID" >> $GITHUB_OUTPUT
          echo "secret_id=$SECRET_ID" >> $GITHUB_OUTPUT
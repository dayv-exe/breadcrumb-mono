name: Build and deploy Breadcrumb backend in test environment

env:
  AWS_REGION: "eu-west-2"

on:
  push:
    branches-ignore:
      - main
      - beta

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Read build directories
        id: build-dirs
        run: |
          BUILD_DIRS=$(cat build_dirs.txt | tr '\n' ',' | sed 's/,$//')
          echo "dirs=$BUILD_DIRS" >> $GITHUB_OUTPUT
          echo "Build directories: $BUILD_DIRS"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: run utils unit tests
        working-directory: backend/utils
        run: go test -v ./...

      - name: run unit tests for models
        working-directory: backend/models
        run: go test -v ./...

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: configure aws creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TEST }}
          role-session-name: github-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: build go bins for lambda
        uses: docker/build-push-action@v6
        with:
          context: backend
          build-args: |
            BUILD_DIRS=${{ steps.build-dirs.outputs.dirs }}
          tags: breadcrumb:latest
          load: true
          cache-from: type=gha,scope=breadcrumb-build
          cache-to: type=gha,scope=breadcrumb-build,mode=max

      - name: extract binaries from image
        working-directory: backend
        run: |
          docker create --name extract-builder breadcrumb:latest
          rm -rf ./bin
          docker cp extract-builder:/app/bin ./bin
          docker rm extract-builder

      - name: deploy sam
        run: |
          sam deploy \
            --template-file template.yaml \
            --s3-bucket breadcrumb-stack-${{ env.AWS_REGION }}-test \
            --stack-name breadcrumb-stack-test \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides EnvironmentName=test \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Get CloudFront PublicKey ID and Secret ID
        id: cf-ids
        run: |
          CF_PUBLIC_KEY_ID=$(aws cloudformation describe-stack-resource \
            --stack-name breadcrumb-stack-test \
            --logical-resource-id CloudFrontPublicKey \
            --region ${{ env.AWS_REGION }} \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          SECRET_ID=$(aws cloudformation describe-stack-resource \
            --stack-name breadcrumb-stack-test \
            --logical-resource-id CloudFrontKeysSecret \
            --region ${{ env.AWS_REGION }} \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)
          echo "CloudFront PublicKey ID (key_pair_id): $CF_PUBLIC_KEY_ID"
          echo "Secrets Manager Secret ID: $SECRET_ID"
          echo "key_pair_id=$CF_PUBLIC_KEY_ID" >> $GITHUB_OUTPUT
          echo "secret_id=$SECRET_ID" >> $GITHUB_OUTPUT